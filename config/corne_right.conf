# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_KEYBOARD_NAME="Keeb0"
CONFIG_ZMK_DISPLAY=y


### Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Tune bluetooth profiles for quick select
# CONFIG_BT_MAX_CONN=3
# Uncomment the following line if you facing issue on win 11 connection
# Enables a combination of settings that are planned to be default in future
# versions of ZMK to improve connection stability. This includes changes to
# timing on BLE pairing initiation, restores use of the updated/new LLCP
# implementation, and disables 2M PHY support.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10


#CONFIG_ZMK_STUDIO=y
#CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ######################################################
## OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y				


# ========================= MOUSE/POINTING ==============================
# Settings for mouse movement functionality

# Enable pointing device support (required for mouse movement)
CONFIG_ZMK_POINTING=y

# Enable smooth scrolling for more natural scroll behavior
# Comment/uncomment based on preference - smooth scrolling uses more resources
# but provides more natural feel
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Optional: Adjust mouse speed (higher = faster)
# CONFIG_ZMK_POINTING_DEFAULT_MOVE_VAL=600

# Optional: Adjust scroll speed (higher = faster)
# CONFIG_ZMK_POINTING_DEFAULT_SCROLL_VAL=20
